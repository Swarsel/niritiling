[package]
name = "niritiling"
version = "0.3.0"
edition = "2024"
description = "Automatic window tiling for the first window in Niri"

[dependencies]
niri-ipc = "=26.4.0"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
